# GitHub automatically looks for workflow files inside .github/workflows
name: Iris ML API - CI Pipeline

on:
  # Run CI whenever code is pushed to the main branch
  push:
    branches:
      - main

  # Also validate proposed changes before merging to main branch
  pull_request:
    branches:
      - main

# Permissions are restricted to repository content only
permissions:
  contents: read
  packages: write

# Define the jobs that make up the pipeline
jobs:
  # Define the job name
  test:
    name: Run Api test
    # Define the type of runner to run the job on
    runs-on: ubuntu-latest

    # Define the steps to be executed as part of the job
    steps:
      # Step 1: download the repo content to the runner
      - name: Checkout code repository
        uses: actions/checkout@v4

      # Step 2: setup Python environment
      - name: Install Python on runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      #step 3: install dependencies
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      #step 4: execute the automated tests
      - name: Run automated tests
        run: python -m pytest -v
      
    build:
      name: Build and publish docker image
      needs: test
      runs-on: ubuntu-latest
      #publish only wheb code is pushed to main branch
      if: github.event_name== 'push' && github.ref == 'refs/heads/main'
      steps:
      #download repo source code
      - name: Checkout source code
        uses: actions/checkout@v4
      
      #enable docker buildkit functionality
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw, value=latest
            type=sha, format=short
      #Build the docker image and push to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . // search for Dockerfile in the current directory
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      

      #step 5: build the docker image
      - name: Build docker image
        run: docker build -t iris-ml-api:${{ github.sha }} .
